[package]
name = "ddd-core"
version = "0.1.0"
edition = "2021"
description = "Kernel genérico DDD + Hexagonal para backends Rust — ver infra-platform/project base/ddd_kernel_mold.md"

[dependencies]
tokio = { version = "1", features = ["sync", "signal", "rt-multi-thread"] }
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tower = { version = "0.4", features = ["limit", "load-shed"] }
tower-http = { version = "0.5", features = ["trace", "compression-full", "limit", "timeout", "catch-panic", "cors", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
